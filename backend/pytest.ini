[pytest]
# Filter only the third-party starlette anyio warning. All other warnings are
# left at their default level so developers see project-level deprecations
# (e.g. datetime.utcnow→now(timezone.utc)) without being silenced.
filterwarnings =
    # Ignore the anyio.abc.BlockingPortal alias deprecation from starlette.testclient
    ignore::DeprecationWarning:starlette.testclient